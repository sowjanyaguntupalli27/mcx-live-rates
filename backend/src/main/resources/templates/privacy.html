<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg-body: #f1f6f2;
            --text-dark: #0f241d;
            --text-light: #576d62;
            --gold-primary: #cda250;
            --gold-bright: #dfb76c;  /* Updated to Match Image */
            --gold-light: #f5eedc;
            --green-dark: #303e49;
            --green-card: #f8faf9;
            --white: #ffffff;
            --border-color: #e2e8e4;
            --red-text: #c0392b;
            --green-text: #cda250;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, .serif {
            font-family: 'Lato', sans-serif;
        }

        /* --- Navbar Styles --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3rem;
            background-color: #303e49;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            height: 100px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            height: 100%;
        }

        .navbar-logo {
            height: 140px;
            width: auto;
            display: block;
            object-fit: contain;
            margin-top: -5px;
        }

        .navbar-nav {
            display: flex;
            gap: 2.5rem;
            align-items: center;
            height: 40%;
        }

        .nav-link {
            text-decoration: none;
            color: var(--gold-primary);
            font-weight: 500;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            height: 100%;
            position: relative;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--gold-bright);
        }

        .nav-link.active {
            color: var(--gold-bright);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--gold-bright);
        }

        /* --- Content Container --- */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        .space-y-6 > * + * {
            margin-top: 1.5rem;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0.5rem 1.5rem;
            }
            .navbar-nav {
                display: none;
            }
        }

    </style>
    <title>Viindhya Bullion - Live Rates</title>
</head>
<body>
<nav class="navbar">
    <a href="#" class="navbar-brand">
        <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/43dadeeb770ebd8e68499bd816c80e8bbfcff1aa?placeholderIfAbsent=true" alt="Viindhya Bullion Logo" class="navbar-logo">
    </a>
    <div class="navbar-nav">
        <a href="/" class="nav-link active">Live Rates</a>
        <a href="/about-us" class="nav-link">About Us</a>
        <a href="/privacy" class="nav-link">Privacy Policy</a>
    </div>
    <div class="navbar-actions">
        <!-- Space allocated for buttons or layout symmetry -->
    </div>
</nav>

<div class="container">
</div>
</body>
</html>

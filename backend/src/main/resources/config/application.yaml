spring:
  jpa:
    generate-ddl: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
      show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect # explicitly define dialect
    database: mysql
  application:
    name:  mcx-live-rates
  docker:
    compose:
      enabled: false # Docker Compose integration disabled

  liquibase:
    change-log: classpath:/db/liquibase-changelog.xml
    enabled: true # Ensure Liquibase is enabled

com:
  vibullion:
    mcx-rates:
      url: https://starlineapi.in/getrates
    build: @project.version@

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        yellow: { 50: "#FFFBEB", 600: "#CA8A04" },
                        stone: { 50: "#FAFAF9" },
                        slate: { 900: "#0F172A" },
                        zinc: { 300: "#D4D4D8" },
                    },
                    fontFamily: {
                        sans: ["DM Sans", "sans-serif"],
                        serif: ["Playfair Display", "serif"],
                    },
                },
            },
        };
    </script>
    <style>
        :root {
            --bg-body: #f1f6f2;
            --text-dark: #0f241d;
            --text-light: #576d62;
            --gold-primary: #cda250;
            --gold-bright: #dfb76c;
            --gold-light: #f5eedc;
            --green-dark: #0f3022;
            --green-card: #f8faf9;
            --white: #ffffff;
            --border-color: #e2e8e4;
            --red-text: #c0392b;
            --green-text: #cda250;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        h1,
        h2,
        h3,
        h4,
        h5,
        .serif {
            font-family: 'Lato', serif;
        }

        .metal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }

        .nav-link {
            position: relative;
            padding-bottom: 5px;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #CA8A04;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .gold-gradient {
            background: linear-gradient(to right, #303e49 0%, #303e49 25%, #3f5060 50%, #303e49 75%, #303e49 100%);
        }

        .main-container {
            max-width: 1300px;
            margin: 6rem auto;
            padding: 2rem;
            width: 100%;
        }

        .rates-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .rates-card {
            background: var(--green-card);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .rates-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .rates-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.8rem;
            color: var(--text-dark);
        }

        .rates-title .material-symbols-outlined {
            color: var(--gold-primary);
            font-size: 1.8rem;
        }

        .silver-card .rates-title .material-symbols-outlined {
            color: #7b8e85;
        }

        .live-updates {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gold-primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .rates-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rates-table th {
            text-align: left;
            font-size: 0.75rem;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
            padding-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        .rates-table th:not(:first-child) {
            text-align: right;
        }

        .rates-table td {
            padding: 1.25rem 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .rates-table tr:last-child td {
            border-bottom: none;
        }

        .rates-table td:not(:first-child) {
            text-align: right;
        }

        .col-purity {
            color: var(--text-light);
            font-weight: 600;
        }

        .col-buy {
            font-weight: 600;
            color: var(--text-dark);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
            font-size: 1.2rem;
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 1024px) {
            .rates-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <title>Viindhya Bullion - Live Rates</title>
</head>

<body class="relative overflow-x-hidden">
    <div th:replace="~{fragments/header :: header(activePage='home')}"></div>

    <div class="main-container">
        <div class="rates-section" id="rates-container">
            <div class="loading">
                <span class="material-symbols-outlined"
                    style="font-size: 2rem; animation: spin 2s linear infinite;">sync</span>
                <p style="margin-top: 1rem;">Fetching live rates...</p>
                <style>
                    @keyframes spin {
                        100% {
                            transform: rotate(360deg);
                        }
                    }
                </style>
            </div>
        </div>
    </div>

    <script>

        const formatCurrency = (value) => {
            return new Intl.NumberFormat('en-IN').format(value);
        };
        const purityKaratMap = {
            'PURITY_999': '24k',
            'PURITY_916': '22k',
            'PURITY_875': '21k',
            'PURITY_833': '20k',
            'PURITY_750': '18k',
            'PURITY_667': '16k',
            'PURITY_583': '14k',
            'PURITY_417': '10k'
        };

        const transformPurityText = (item) => {
            if (!item.purity) return `Purity ${item.purityValue || ''}`;
            let karatLabel = purityKaratMap[item.purity];
            if (!karatLabel) {
                let rawPurity = item.purity.replace('PURITY_', '');
                karatLabel = parts.map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join(' ');
            }
            if (item.purityValue) {
                return `${karatLabel} / ${item.purityValue}`;
            }
            return karatLabel;
        };

        const generateRowsHtml = (data) => {
            if (!Array.isArray(data)) return '';
            return data.map(item => {
                const buy = item.ratePerGram || 0;
                const purityLabel = transformPurityText(item);
                return `
            <tr>
                <td class="col-purity">${purityLabel}</td>
                <td class="col-buy">₹${formatCurrency(buy)}</td>
            </tr>
        `;
            }).join('');
        };


        const createGoldTable = (data, timeString) => {
            if (!data || data.length === 0) return '';
            return `
        <div class="rates-card gold-card">
            <div class="rates-header">
                <div class="rates-title">
                    <span class="material-symbols-outlined">monetization_on</span>
                    <h2 class="metal-title">Gold Live Rate</h2>
                </div>
                <div class="live-updates">Live ${timeString}</div>
            </div>
            <table class="rates-table">
                <thead>
                    <tr>
                        <th>Purity Description</th>
                        <th>Sell</th>
                    </tr>
                </thead>
                <tbody>
                    ${generateRowsHtml(data)}
                </tbody>
            </table>
        </div>
    `;
        };

        const createSilverTable = (data, timeString) => {
            if (!data || data.length === 0) return '';
            return `
        <div class="rates-card silver-card">
            <div class="rates-header">
                <div class="rates-title">
                    <span class="material-symbols-outlined">layers</span>
                    <h2 class="metal-title">Silver Live Rate</h2>
                </div>
                <div class="live-updates">Live ${timeString}</div>
            </div>
            <table class="rates-table">
                <thead>
                    <tr>
                        <th>Purity Description</th>
                        <th>Rate (Per Gram)</th>
                    </tr>
                </thead>
                <tbody>
                    ${generateRowsHtml(data)}
                </tbody>
            </table>
        </div>
    `;
        };

        const fetchRates = async () => {
            try {
                const response = await fetch('/mcxRates/purities');
                if (!response.ok) throw new Error('Data endpoint unreachable');
                const data = await response.json();

                const container = document.getElementById('rates-container');
                if (!container) return;

                const hasGold = data && data.gold && Array.isArray(data.gold) && data.gold.length > 0;
                const hasSilver = data && data.silver && Array.isArray(data.silver) && data.silver.length > 0;

                if (!hasGold && !hasSilver) {
                    container.innerHTML = `
                <div class="loading" style="color: var(--text-light); grid-column: 1 / -1;">
                    <span class="material-symbols-outlined" style="font-size: 2.5rem; color: var(--gold-primary);">trending_flat</span>
                    <p style="margin-top: 1.25rem;">No active market trades posted for this session.</p>
                </div>
            `;
                    return;
                }

                const now = new Date();
                const timestamp = `@ ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

                container.innerHTML = `
            ${hasGold ? createGoldTable(data.gold, timestamp) : ''}
            ${hasSilver ? createSilverTable(data.silver, timestamp) : ''}
        `;
            } catch (error) {
                console.error('System Exception Caught on Render:', error);
                const container = document.getElementById('rates-container');
                if (container) {
                    container.innerHTML = `
                <div class="loading" style="color: var(--red-text); grid-column: 1 / -1;">
                    <span class="material-symbols-outlined" style="font-size: 2.5rem;">error</span>
                    <p style="margin-top: 1.25rem; font-weight: 700;">Unable to connect to dynamic rate services.</p>
                    <p style="font-size: 0.9rem; margin-top: 0.25rem; color: var(--text-light)">Retrying automatically in the background...</p>
                </div>
            `;
                }
            }
        };
        window.addEventListener('DOMContentLoaded', () => {
            fetchRates();
            setInterval(fetchRates, 1000);
        });
    </script>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>

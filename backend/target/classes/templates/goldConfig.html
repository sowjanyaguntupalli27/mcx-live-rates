<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg-body: #f1f6f2;
            --text-dark: #0f241d;
            --text-light: #576d62;
            --gold-primary: #cda250;
            --gold-bright: #dfb76c;  /* Updated to Match Image */
            --gold-light: #f5eedc;
            --green-dark: #303e49;
            --green-card: #f8faf9;
            --white: #ffffff;
            --border-color: #e2e8e4;
            --red-text: #c0392b;
            --green-text: #cda250;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, .serif {
            font-family: 'Lato', sans-serif;
        }

        /* --- Navbar Styles --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3rem;
            background-color: #303e49;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            height: 100px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            height: 100%;
        }

        .navbar-logo {
            height: 140px;
            width: auto;
            display: block;
            object-fit: contain;
            margin-top: -5px;
        }

        .navbar-nav {
            display: flex;
            gap: 2.5rem;
            align-items: center;
            height: 40%;
        }

        .nav-link {
            text-decoration: none;
            color: var(--gold-primary);
            font-weight: 500;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            height: 100%;
            position: relative;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--gold-bright);
        }

        .nav-link.active {
            color: var(--gold-bright);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--gold-bright);
        }

        /* --- Content Container --- */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        .rates-section {
            display: block; /* Overrides grid layout structure */
            width: 100%;
        }

        /* --- Centered Dashboard Config Card --- */
        .config-card {
            background: var(--green-card);
            border-radius: 8px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            width: 100%;
            max-width: 500px;        /* Prevents full screen stretching */
            margin: 2rem auto;       /* Centers the container box on the page */
        }

        /* --- Full Width Tab Navigation --- */
        .tabs-nav {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2rem;
            width: 100%;
            justify-content: space-between;
        }

        .tab-btn {
            flex: 1;                 /* Allocates perfect 50/50 split width layout */
            background: none;
            border: none;
            font-family: 'Lato', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-light);
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            position: relative;
            transition: color 0.2s ease;
            text-align: center;
        }

        .tab-btn.active-tab {
            color: var(--green-dark);
        }

        .tab-btn.active-tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--gold-primary);
        }

        /* --- Hidden Panels (Toggled by Script) --- */
        .tab-panel {
            display: none;
            text-align: center;
            width: 100%;
        }

        /* Hardcoded Default Display Target State */
        .tab-panel.active-panel {
            display: block;
        }

        /* --- Unified Form Styling Components --- */
        .space-y-6 > * + * {
            margin-top: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
            margin: 0 auto 1.5rem auto;
            text-align: center;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-submit {
            background-color: var(--green-dark);
            color: var(--white);
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #164733;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0.5rem 1.5rem;
            }
            .navbar-nav {
                display: none;
            }
        }

        .form-input {
            width: 100%;             /* Spans full alignment with the stretched tab header bar above */
            padding: 0.75rem 1rem;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;  /* Prevents padding from breaking layout width borders */
        }

        .btn-submit {
            background-color: var(--green-dark);
            color: var(--white);
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;             /* Stretches the submit block to match the text box layout */
            box-sizing: border-box;
        }
        .trend-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem !important;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            margin-left: 0.75rem;
            vertical-align: middle;
        }

        .trend-up {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .trend-down {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .trend-neutral {
            background-color: #f5f5f5;
            color: #616161;
            border: 1px solid #e0e0e0;
        }
    </style>
    <title>Viindhya Bullion - Live Rates</title>
</head>
<body>
<nav class="navbar">
    <a href="#" class="navbar-brand">
        <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/43dadeeb770ebd8e68499bd816c80e8bbfcff1aa?placeholderIfAbsent=true" alt="Viindhya Bullion Logo" class="navbar-logo">
    </a>
    <div class="navbar-nav">
        <a href="#" class="nav-link active">Live Rates</a>
        <a href="#" class="nav-link">About Us</a>
        <a href="#" class="nav-link">Contact Us</a>
        <a href="#" class="nav-link">Privacy Policy</a>
    </div>
    <div class="navbar-actions">
        <!-- Space allocated for buttons or layout symmetry -->
    </div>
</nav>

<div class="container">
    <!-- Rates Section -->
    <div class="rates-section" id="rates-container">

        <!-- Integrated Tab Panel Structure -->
        <div class="config-card">

            <div class="tabs-nav">
                <button type="button" class="tab-btn active-tab" onclick="switchConfigTab(event, 'gold-config')">Gold Config</button>
                <button type="button" class="tab-btn" onclick="switchConfigTab(event, 'silver-config')">Silver Config</button>
            </div>

            <div id="gold-config" class="tab-panel active-panel">
                <div class="live-price-badge" style="background-color: rgba(205, 162, 80, 0.1); padding: 0.75rem; border-radius: 4px; margin-bottom: 1.5rem; border: 1px solid var(--gold-primary);">
                    <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-light); text-transform: uppercase;">Current Market Ask (Per 10g)</span>
                    <h3 id="gold-current-ask" style="font-size: 1.6rem; color: var(--gold-primary); font-weight: 700; margin-top: 0.25rem;">Fetching...</h3>
                </div>

                <form role="form" data-symbol="GOLD" action="/api/config/GOLD" method="post" class="space-y-6 config-form">
                    <div class="form-group">
                        <label class="form-label" for="gold-spread">Spread Charges (Per Gram)</label>
                        <input type="number" step="0.01" min="0" id="gold-spread" name="spreadCharges" class="form-input spread-input" placeholder="Loading current settings..." required>
                    </div>

                    <div class="form-group otp-container" style="display: none;">
                        <label class="form-label" for="gold-otp" style="color: var(--red-text); font-weight: bold;">Enter Valid OTP</label>
                        <input type="text" inputmode="numeric" pattern="[0-9]*" id="gold-otp" name="otp" class="form-input otp-input" placeholder="000000">
                    </div>

                    <button type="submit" class="btn-submit">Save Gold Config</button>
                </form>
            </div>

            <div id="silver-config" class="tab-panel">
                <div class="live-price-badge" style="background-color: rgba(97, 106, 102, 0.1); padding: 0.75rem; border-radius: 4px; margin-bottom: 1.5rem; border: 1px solid #7b8e85;">
                    <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-light); text-transform: uppercase;">Current Market Ask (Per KG)</span>
                    <h3 id="silver-current-ask" style="font-size: 1.6rem; color: #576d62; font-weight: 700; margin-top: 0.25rem;">Fetching...</h3>
                </div>

                <form role="form" data-symbol="SILVER" action="/api/config/SILVER" method="post" class="space-y-6 config-form">
                    <div class="form-group">
                        <label class="form-label" for="silver-spread">Spread Charges (Per KG)</label>
                        <input type="number" step="0.01" min="0" id="silver-spread" name="spreadCharges" class="form-input spread-input" placeholder="Loading current settings..." required>
                    </div>

                    <div class="form-group otp-container" style="display: none;">
                        <label class="form-label" for="silver-otp" style="color: var(--red-text); font-weight: bold;">Enter Verification OTP</label>
                        <input type="text" inputmode="numeric" pattern="[0-9]*" id="silver-otp" name="otp" class="form-input otp-input" placeholder="000000">
                    </div>

                    <button type="submit" class="btn-submit">Save Silver Config</button>
                </form>
            </div>

        </div>
    </div>
</div>

<script>

    const PRICE_CACHE = {
                            goldAsk: null,
                            silverAsk: null,
                            prevGoldAsk: null,
                            prevSilverAsk: null
                        };

        const formatCurrency = (value) => {
            return new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
        };

        function switchConfigTab(event, targetPanelId) {
            event.preventDefault();

            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach(btn => btn.classList.remove('active-tab'));

            const tabPanels = document.querySelectorAll('.tab-panel');
            tabPanels.forEach(panel => panel.classList.remove('active-panel'));

            event.currentTarget.classList.add('active-tab');
            document.getElementById(targetPanelId).classList.add('active-panel');
        }

        const generateDifferenceHtml = (newPrice, oldPrice) => {
            if (oldPrice === null || oldPrice === undefined || newPrice === oldPrice) {
                return `<span class="trend-badge trend-neutral">Unchanged</span>`;
            }
            const difference = newPrice - oldPrice;
            const formattedDiff = formatCurrency(Math.abs(difference));

            if (difference > 0) {
                return `<span class="trend-badge trend-up">▲ +₹${formattedDiff}</span>`;
            } else {
                return `<span class="trend-badge trend-down">▼ -₹${formattedDiff}</span>`;
            }
        };

        const fetchLivePriceData = async () => {
            try {
                const response = await fetch('/mcxRates');
                if (!response.ok) throw new Error('Network bridge interface dropped');
                const data = await response.json();

                const goldDisplay = document.getElementById('gold-current-ask');
                const silverDisplay = document.getElementById('silver-current-ask');

                if (Array.isArray(data) && data.length > 0) {
                    const goldRecord = data.find(item => item && item.symbol && item.symbol.toLowerCase() === 'gold');
                    const silverRecord = data.find(item => item && item.symbol && item.symbol.toLowerCase() === 'silver');

                    if (goldRecord && goldRecord.Ask !== undefined && goldRecord.Ask !== null) {
                        if (PRICE_CACHE.goldAsk !== null && PRICE_CACHE.goldAsk !== goldRecord.Ask) {
                            PRICE_CACHE.prevGoldAsk = PRICE_CACHE.goldAsk; // Cache older state
                        }
                        PRICE_CACHE.goldAsk = goldRecord.Ask;
                    }

                    if (goldDisplay && PRICE_CACHE.goldAsk !== null) {
                        const trendHtml = generateDifferenceHtml(PRICE_CACHE.goldAsk, PRICE_CACHE.prevGoldAsk);
                        goldDisplay.innerHTML = `₹${formatCurrency(PRICE_CACHE.goldAsk)} ${trendHtml}`;
                    } else if (goldDisplay) {
                        goldDisplay.innerText = "Unavailable";
                    }

                    if (silverRecord && silverRecord.Ask !== undefined && silverRecord.Ask !== null) {
                        if (PRICE_CACHE.silverAsk !== null && PRICE_CACHE.silverAsk !== silverRecord.Ask) {
                            PRICE_CACHE.prevSilverAsk = PRICE_CACHE.silverAsk;
                        }
                        PRICE_CACHE.silverAsk = silverRecord.Ask;
                    }

                    if (silverDisplay && PRICE_CACHE.silverAsk !== null) {
                        const trendHtml = generateDifferenceHtml(PRICE_CACHE.silverAsk, PRICE_CACHE.prevSilverAsk);
                        silverDisplay.innerHTML = `₹${formatCurrency(PRICE_CACHE.silverAsk)} ${trendHtml}`;
                    } else if (silverDisplay) {
                        silverDisplay.innerText = "Unavailable";
                    }
                } else {
                    renderCachedFallback();
                }

            }
            catch (error) {
                console.warn('Network issue caught. Retaining previous price figures locally:', error);
                renderCachedFallback();
            }
        };

        const renderCachedFallback = () => {
            const goldDisplay = document.getElementById('gold-current-ask');
            const silverDisplay = document.getElementById('silver-current-ask');

            if (goldDisplay && PRICE_CACHE.goldAsk !== null) {
                const trendHtml = generateDifferenceHtml(PRICE_CACHE.goldAsk, PRICE_CACHE.prevGoldAsk);
                goldDisplay.innerHTML = `₹${formatCurrency(PRICE_CACHE.goldAsk)} ${trendHtml}`;
            } else if (goldDisplay && goldDisplay.innerText === "Fetching...") {
                goldDisplay.innerText = "Offline";
            }

            if (silverDisplay && PRICE_CACHE.silverAsk !== null) {
                const trendHtml = generateDifferenceHtml(PRICE_CACHE.silverAsk, PRICE_CACHE.prevSilverAsk);
                silverDisplay.innerHTML = `₹${formatCurrency(PRICE_CACHE.silverAsk)} ${trendHtml}`;
            } else if (silverDisplay && silverDisplay.innerText === "Fetching...") {
                silverDisplay.innerText = "Offline";
            }
        };

        const loadExistingConfigurations = async () => {
            const configurations = [{ symbol: 'GOLD', inputId: 'gold-spread' }, { symbol: 'SILVER', inputId: 'silver-spread' }];

            for (const config of configurations) {
                const inputElement = document.getElementById(config.inputId);
                if (!inputElement) continue;
                try {
                    const response = await fetch(`/api/config/${config.symbol}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.spreadCharges !== undefined && data.spreadCharges !== null) {
                            inputElement.value = data.spreadCharges;
                        }
                    }
                } catch (error) {
                    console.error(`Could not look up initial config configurations for ${config.symbol}:`, error);
                }
            }
        };

        const initialize = () => {
            const forms = document.querySelectorAll('form[action*="setupGoldPrice"], form[action*="setupSilverPrice"], form[action*="api/config"]');
            forms.forEach(form => {
                let isOtpSent = false;
                let statusMessage = form.querySelector('.form-status-message');
                if (!statusMessage) {
                    statusMessage = document.createElement('div');
                    statusMessage.className = 'form-status-message';
                    statusMessage.style.fontSize = '0.9rem';
                    statusMessage.style.fontWeight = '700';
                    statusMessage.style.textAlign = 'center';
                    statusMessage.style.marginTop = '1rem';
                    statusMessage.style.display = 'none';
                    form.insertBefore(statusMessage, form.querySelector('.btn-submit'));
                }

                form.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    statusMessage.style.display = 'none';
                    statusMessage.innerText = '';
                    const submitBtn = form.querySelector('.btn-submit');
                    const originalText = submitBtn ? submitBtn.innerText : 'Save Config';
                    let otpContainer = form.querySelector('.otp-container');
                    if (!otpContainer) {
                        otpContainer = document.createElement('div');
                        otpContainer.className = 'form-group otp-container';
                        otpContainer.style.display = 'none';
                        otpContainer.style.marginTop = '1rem';
                        otpContainer.innerHTML = `
                        <label class="form-label" style="color: var(--red-text); font-weight: bold;">Enter Verification OTP</label>
                        <input type="text" inputmode="numeric" pattern="[0-9]*" name="otp" class="form-input otp-input" placeholder="000000" required>`;
                        form.insertBefore(otpContainer, statusMessage);
                    }
                    const otpInput = otpContainer.querySelector('.otp-input');

                    // PHASE 1: Send OTP request
                    if (!isOtpSent) {
                        if (submitBtn) {
                            submitBtn.innerText = 'Sending OTP...';
                            submitBtn.disabled = true;
                        }

                        try {
                            const otpResponse = await fetch('/api/config/otp');

                            if (otpResponse.status === 200 || otpResponse.ok) {
                                statusMessage.style.color = '#2e7d32';
                                statusMessage.innerText = 'OTP sent successfully to your registered mobile number.';
                                statusMessage.style.display = 'block';

                                otpContainer.style.display = 'flex';
                                otpInput.required = true;
                                otpInput.focus();

                                isOtpSent = true;
                                if (submitBtn) submitBtn.innerText = 'Verify & Save Config';
                            } else {
                                throw new Error(`Status code: ${otpResponse.status}`);
                            }
                        } catch (error) {
                            console.error('OTP processing failure state:', error);
                            statusMessage.style.color = 'var(--red-text)';
                            statusMessage.innerText = 'Could not deliver OTP. Please try again.';
                            statusMessage.style.display = 'block';

                            if (submitBtn) submitBtn.innerText = originalText;
                        } finally {
                            if (submitBtn) submitBtn.disabled = false;
                        }
                        return;
                    }

                    if (submitBtn) {
                        submitBtn.innerText = 'Verifying...';
                        submitBtn.disabled = true;
                    }

                    try {
                        const response = await fetch(form.action || window.location.href, {
                            method: 'POST',
                            body: new FormData(form)
                        });

                        if (response.ok) {
                            statusMessage.style.color = '#2e7d32'; // Green text
                            statusMessage.innerText = 'Charges updated successfully!';
                            statusMessage.style.display = 'block';

                            otpContainer.style.display = 'none';
                            otpInput.required = false;
                            otpInput.value = '';
                            isOtpSent = false;
                            if (submitBtn) submitBtn.innerText = originalText;
                        } else {
                            statusMessage.style.color = 'var(--red-text)';
                            statusMessage.innerText = 'Verification failed. Incorrect OTP.';
                            statusMessage.style.display = 'block';
                        }
                    } catch (error) {
                        console.error('Form processing error caught:', error);
                        statusMessage.style.color = 'var(--red-text)';
                        statusMessage.innerText = 'An execution error occurred while processing updates.';
                        statusMessage.style.display = 'block';
                    } finally {
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            if (!isOtpSent && submitBtn) submitBtn.innerText = originalText;
                        }
                    }
                });
            });
        };
        window.addEventListener('DOMContentLoaded', () => {
        fetchLivePriceData();
        setInterval(fetchLivePriceData, 1000);
        loadExistingConfigurations();
        initialize();
    });

</script>
</body>
</html>

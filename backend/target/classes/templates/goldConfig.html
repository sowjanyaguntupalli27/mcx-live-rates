<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        /* --- KEEPING YOUR UNTOUCHED GLOBAL STYLES --- */
        :root {
            --bg-body: #f1f6f2;
            --text-dark: #302f2f;
            --text-light: #4e6375;
            --gold-primary: #d5a323;
            --gold-bright: #dfb76c;
            --gold-light: #f5eedc;
            --green-dark: #3a4851;
            --green-card: #f8faf9;
            --white: #ffffff;
            --border-color: #e2e8e4;
            --red-text: #c0392b;
            --green-text: #cda250;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, .serif {
            font-family: 'Lato', sans-serif;
        }

        .container {
            max-width: 1300px;
            margin: 4rem auto;
            padding: 2rem;
            width: 100%;
        }

        .rates-section {
            display: block;
            width: 100%;
        }

        /* --- PREVALENT REFACTORED ELEMENT UI --- */
        .config-terminal {
            background: var(--white);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin: 2rem auto;
        }

        .tabs-nav {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2rem;
            width: 100%;
            justify-content: space-between;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            font-family: 'Lato', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-light);
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            position: relative;
            transition: color 0.2s ease;
            text-align: center;
        }

        .tab-btn.active-tab {
            color: var(--green-dark);
        }

        .tab-btn.active-tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--gold-primary);
        }

        .tab-panel {
            display: none;
            text-align: center;
            width: 100%;
        }

        .tab-panel.active-panel {
            display: block;
        }

        /* Modernized Form Inputs UI Layout */
        .premium-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .premium-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .premium-input-field {
            width: 100%;
            padding: 0.85rem 1rem;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .premium-input-field:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px rgba(138, 107, 48, 0.1);
        }

        .btn-submit {
            background-color: var(--green-dark);
            color: var(--white);
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #2c373e;
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .trend-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem !important;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            margin-left: 0.75rem;
            vertical-align: middle;
        }

        .trend-up { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .trend-down { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .trend-neutral { background-color: #f5f5f5; color: #616161; border: 1px solid #e0e0e0; }

        .form-status-message {
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1.25rem;
            padding: 0.75rem;
            border-radius: 6px;
        }
    </style>
    <title>Viindhya Bullion - Live Rates</title>
</head>
<body class="relative overflow-x-hidden">
<div th:replace="~{fragments/header :: header(activePage='home')}"></div>
<div class="container">
    <div class="rates-section" id="rates-container">

        <div class="config-terminal">

            <div class="tabs-nav">
                <button type="button" class="tab-btn active-tab" onclick="switchConfigTab(event, 'gold-config')">Gold Config</button>
                <button type="button" class="tab-btn" onclick="switchConfigTab(event, 'silver-config')">Silver Config</button>
            </div>

            <div id="gold-config" class="tab-panel active-panel">
                <div class="live-price-badge" style="background-color: rgba(205, 162, 80, 0.1); padding: 0.75rem; border-radius: 4px; margin-bottom: 1.5rem; border: 1px solid var(--gold-primary);">
                    <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-light); text-transform: uppercase;">Current Market Ask (Per 10g)</span>
                    <h3 id="gold-current-ask" style="font-size: 1.6rem; color: var(--gold-primary); font-weight: 700; margin-top: 0.25rem;">Fetching...</h3>
                </div>

                <form role="form" data-symbol="GOLD" action="/api/config/GOLD" method="post" class="config-form">
                    <div class="premium-input-group">
                        <label class="premium-label" for="gold-spread">Spread Charges (Per 10 Gram)</label>
                        <input type="number" step="0.01" min="0" id="gold-spread" name="spreadCharges" class="premium-input-field" placeholder="Loading current settings..." required>
                    </div>

                    <div class="premium-input-group">
                        <label class="premium-label" for="gold-difference">BID Difference</label>
                        <input type="number" step="0.01" min="0" id="gold-difference" name="difference" class="premium-input-field" placeholder="Loading current settings..." required>
                    </div>

                    <div class="premium-input-group otp-container" style="display: none;">
                        <label class="premium-label" for="gold-otp" style="color: var(--red-text); font-weight: bold;">Enter Valid OTP</label>
                        <input type="text" inputmode="numeric" pattern="[0-9]*" id="gold-otp" name="otp" class="premium-input-field" style="border-color: var(--red-text);" placeholder="000000">
                    </div>

                    <button type="submit" class="btn-submit">Save Gold Config</button>
                </form>
            </div>

            <div id="silver-config" class="tab-panel">
                <div class="live-price-badge" style="background-color: rgba(97, 106, 102, 0.1); padding: 0.75rem; border-radius: 4px; margin-bottom: 1.5rem; border: 1px solid #7b8e85;">
                    <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-light); text-transform: uppercase;">Current Market Ask (Per KG)</span>
                    <h3 id="silver-current-ask" style="font-size: 1.6rem; color: #576d62; font-weight: 700; margin-top: 0.25rem;">Fetching...</h3>
                </div>

                <form role="form" data-symbol="SILVER" action="/api/config/SILVER" method="post" class="config-form">
                    <div class="premium-input-group">
                        <label class="premium-label" for="silver-spread">Spread Charges (Per KG)</label>
                        <input type="number" step="0.01" min="0" id="silver-spread" name="spreadCharges" class="premium-input-field" placeholder="Loading current settings..." required>
                    </div>

                    <div class="premium-input-group">
                        <label class="premium-label" for="silver-difference">BID Difference</label>
                        <input type="number" step="0.01" min="0" id="silver-difference" name="difference" class="premium-input-field" placeholder="Loading current settings..." required>
                    </div>

                    <div class="premium-input-group otp-container" style="display: none;">
                        <label class="premium-label" for="silver-otp" style="color: var(--red-text); font-weight: bold;">Enter Verification OTP</label>
                        <input type="text" inputmode="numeric" pattern="[0-9]*" id="silver-otp" name="otp" class="premium-input-field" style="border-color: var(--red-text);" placeholder="000000">
                    </div>

                    <button type="submit" class="btn-submit">Save Silver Config</button>
                </form>
            </div>

        </div>
    </div>
</div>

<script>
    const PRICE_CACHE = { goldAsk: null, silverAsk: null, prevGoldAsk: null, prevSilverAsk: null };

    const formatCurrency = (value) => {
        return new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
    };

    function switchConfigTab(event, targetPanelId) {
        event.preventDefault();
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
        document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active-panel'));

        event.currentTarget.classList.add('active-tab');
        document.getElementById(targetPanelId).classList.add('active-panel');
    }

    const generateDifferenceHtml = (newPrice, oldPrice) => {
        if (oldPrice === null || oldPrice === undefined || newPrice === oldPrice) {
            return `<span class="trend-badge trend-neutral">Unchanged</span>`;
        }
        const difference = newPrice - oldPrice;
        const formattedDiff = formatCurrency(Math.abs(difference));
        return difference > 0
            ? `<span class="trend-badge trend-up">▲ +₹${formattedDiff}</span>`
            : `<span class="trend-badge trend-down">▼ -₹${formattedDiff}</span>`;
    };

    const fetchLivePriceData = async () => {
        try {
            const response = await fetch('/mcxRates');
            if (!response.ok) throw new Error();
            const data = await response.json();

            if (Array.isArray(data) && data.length > 0) {
                const goldRecord = data.find(item => item?.symbol?.toLowerCase() === 'gold');
                const silverRecord = data.find(item => item?.symbol?.toLowerCase() === 'silver');

                if (goldRecord?.Ask != null) {
                    if (PRICE_CACHE.goldAsk !== null && PRICE_CACHE.goldAsk !== goldRecord.Ask) {
                        PRICE_CACHE.prevGoldAsk = PRICE_CACHE.goldAsk;
                    }
                    PRICE_CACHE.goldAsk = goldRecord.Ask;
                }
                if (silverRecord?.Ask != null) {
                    if (PRICE_CACHE.silverAsk !== null && PRICE_CACHE.silverAsk !== silverRecord.Ask) {
                        PRICE_CACHE.prevSilverAsk = PRICE_CACHE.silverAsk;
                    }
                    PRICE_CACHE.silverAsk = silverRecord.Ask;
                }
            }
            renderDisplays();
        } catch (error) {
            renderDisplays(true);
        }
    };

    const renderDisplays = (isOffline = false) => {
        const goldDisplay = document.getElementById('gold-current-ask');
        const silverDisplay = document.getElementById('silver-current-ask');

        if (goldDisplay) {
            goldDisplay.innerHTML = PRICE_CACHE.goldAsk !== null
                ? `₹${formatCurrency(PRICE_CACHE.goldAsk)} ${generateDifferenceHtml(PRICE_CACHE.goldAsk, PRICE_CACHE.prevGoldAsk)}`
                : (isOffline ? "Offline" : "Fetching...");
        }
        if (silverDisplay) {
            silverDisplay.innerHTML = PRICE_CACHE.silverAsk !== null
                ? `₹${formatCurrency(PRICE_CACHE.silverAsk)} ${generateDifferenceHtml(PRICE_CACHE.silverAsk, PRICE_CACHE.prevSilverAsk)}`
                : (isOffline ? "Offline" : "Fetching...");
        }
    };

    const loadExistingConfigurations = async () => {
        const configurations = [
            { symbol: 'GOLD', inputId: 'gold-spread' }, { symbol: 'SILVER', inputId: 'silver-spread' },
            { symbol: 'GOLD', inputId: 'gold-difference'}, { symbol: 'SILVER', inputId: 'silver-difference' }
        ];

        for (const config of configurations) {
            const inputElement = document.getElementById(config.inputId);
            if (!inputElement) continue;
            try {
                const response = await fetch(`/api/config/${config.symbol}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data[inputElement.name] != null) {
                        inputElement.value = data[inputElement.name];
                    }
                }
            } catch (error) {
                console.error(`Error loading config for ${config.symbol}:`, error);
            }
        }
    };

    const initializeFormProcessing = () => {
        document.querySelectorAll('.config-form').forEach(form => {
            let isOtpSent = false;

            let statusMessage = document.createElement('div');
            statusMessage.className = 'form-status-message';
            statusMessage.style.display = 'none';
            // Insert messaging block right above the submit button dynamically
            form.insertBefore(statusMessage, form.querySelector('.btn-submit'));

            const otpContainer = form.querySelector('.otp-container');
            const otpInput = form.querySelector('.otp-input') || form.querySelector('input[name="otp"]');
            const submitBtn = form.querySelector('.btn-submit');
            const originalText = submitBtn ? submitBtn.innerText : 'Save Config';

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                statusMessage.style.display = 'none';
                statusMessage.innerText = '';
                statusMessage.style.background = 'transparent';
                if (submitBtn) submitBtn.disabled = true;

                // PHASE 1: Send OTP code challenge
                if (!isOtpSent) {
                    if (submitBtn) submitBtn.innerText = 'Sending OTP...';
                    try {
                        const otpResponse = await fetch('/api/config/otp');
                        if (otpResponse.ok) {
                            statusMessage.style.color = '#2e7d32';
                            statusMessage.style.background = '#e8f5e9';
                            statusMessage.innerText = 'OTP sent successfully to your registered mobile number.';
                            statusMessage.style.display = 'block';

                            if (otpContainer) otpContainer.style.display = 'flex';
                            if (otpInput) { otpInput.required = true; otpInput.focus(); }
                            isOtpSent = true;
                            if (submitBtn) submitBtn.innerText = 'Verify & Save Config';
                        } else {
                            throw new Error();
                        }
                    } catch (error) {
                        statusMessage.style.color = 'var(--red-text)';
                        statusMessage.style.background = '#ffebee';
                        statusMessage.innerText = 'Could not deliver OTP. Please try again.';
                        statusMessage.style.display = 'block';
                        if (submitBtn) submitBtn.innerText = originalText;
                    } finally {
                        if (submitBtn) submitBtn.disabled = false;
                    }
                    return;
                }

                // PHASE 2: Submit settings verification payload
                if (submitBtn) submitBtn.innerText = 'Verifying...';
                try {
                    const response = await fetch(form.action || window.location.href, {
                        method: 'POST',
                        body: new FormData(form)
                    });

                    if (response.ok) {
                        statusMessage.style.color = '#2e7d32';
                        statusMessage.style.background = '#e8f5e9';
                        statusMessage.innerText = 'Charges updated successfully!';
                        statusMessage.style.display = 'block';

                        if (otpContainer) otpContainer.style.display = 'none';
                        if (otpInput) { otpInput.required = false; otpInput.value = ''; }
                        isOtpSent = false;
                        if (submitBtn) submitBtn.innerText = originalText;

                        // Timeout updates banner to auto disappear after exactly 3 seconds
                        setTimeout(() => {
                            statusMessage.style.display = 'none';
                        }, 3000);
                    } else {
                        statusMessage.style.color = 'var(--red-text)';
                        statusMessage.style.background = '#ffebee';
                        statusMessage.innerText = 'Verification failed. Incorrect OTP.';
                        statusMessage.style.display = 'block';
                    }
                } catch (error) {
                    statusMessage.style.color = 'var(--red-text)';
                    statusMessage.style.background = '#ffebee';
                    statusMessage.innerText = 'An execution error occurred while processing updates.';
                    statusMessage.style.display = 'block';
                } finally {
                    if (submitBtn) submitBtn.disabled = false;
                }
            });
        });
    };

    window.addEventListener('DOMContentLoaded', () => {
        fetchLivePriceData();
        setInterval(fetchLivePriceData, 1000);
        loadExistingConfigurations();
        initializeFormProcessing();
    });
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
